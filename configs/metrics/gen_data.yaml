artifact_key: "my_generated_images"
source_type: "list"         # We'll eventually store them as a list or folder
data_label: "image"
n_samples: 32
batch_size: 4
device: "cuda"

# The next block might describe the conditioning dataset or how to find it
conditioning_data:
  artifact_key: "real_conditioning_data"
  source_type: "folder"
  data_label: "tab"
  folder_path: "/path/to/tabular/folder"

# Additional arguments to diffusion
diffusion_args:
  guidance_scale: 1.0
  steps: 50

# Optional: If we want to store output on disk:
save_to_disk_path: "/path/to/generated_output"
save_to_disk_format: "folder"   # Or "npy" etc. (your choice)
