data:
  # locations
  data_dir: "/mnt/dataset_storage/data/adni_nacc_processing_steps/final_2d" #"/mnt/dataset_storage/data/lumir_mm_dataset_middle_slice" #"/mnt/dataset_storage/data/nacc_dataset/nacc_subset/middle_slice"
  stats_file: "/home/PRISMS/data/computations" #"..data/computations/nacc_stats.json"
  # dimensions
  image_size: 32
  image_height: 256
  image_width: 256
  target_channels: 1
  # dataloader
  dataset_type: "nacc"
  batch_size: 16
  num_workers: 4
  # processing
  domain: "mri"
  final_image_range: "minus1to1"
  do_image_normalize: true
  do_tabular_normalize: false
  do_augment: false
  shuffle: false
  # debugging
  debug: true

  split:
    enable: true       # set false to get 100 %-train behaviour
    kwargs: # will be **expanded into train_test_split
      test_size: 0.2   # val fraction (may also be int)
      random_state: 42 # reproducible
      shuffle: true
      stratify: true   # honour class ratio; you may drop it for unsupervised cases