defaults:
  - ../models/vae@_global_
  - ../models/dit@_global_
  - ../models/diffusion@_global_
  - ../datasets/nacc@_global_
  - ../datasets/nacc_synth@_global_
  - _self_

dit:
  input_size: 32
  patch_size: 2
  in_channels: 4
  dim: 768 #512
  depth: 20 #18 #15
  head_dim: 64 #16 #8
  multiple_of: 128
  norm_eps: 1e-6
  depth_init: True
  use_bias: True
  # Patch mixer
  use_patch_mixer: False #True
  patch_mixer_depth: 0 #6
  patch_mixer_dim: 256
  patch_mixer_qkv_ratio: 1.0
  patch_mixer_mlp_ratio: 4.0
  # Experts (MoE)
  num_experts: 0 #8
  expert_capacity: 0.0 #2.0
  experts_every_n: 0 #3 #2

data:
  dataset_type: "nacc"
  # dimensions
  image_size: 32
  image_height: 256
  image_width: 256
  target_channels: 3
  # dataloader
  batch_size: 4
  num_workers: 4
  # processing
  do_image_normalize: true
  do_tabular_normalize: false
  do_augment: false
  # debugging
  debug: false
  regen_tab_ft: true
#  random_subset: 500

data_synth:
  data_dir: "/mnt/storage/nacc_sub/generated" #"/mnt/storage/nacc_sub/generated"
  batch_size: 8
  save_label: "8bis_78k"
  num_samples: 1000
  sample_steps: 40
  guidance_img: 1.2
  guidance_tab: 1.0
  debug: false
  regen_tab_ft: false

diffusion:
  num_tab_features: 157

training:
  device: "cuda"
  sample_batch_size: 4

  grad_accum: 2
  gate_warmup_steps: 3000 #2500
  warmup_frac: 0.05
  gradient_clip: 1.0

  # hyperparameters
  epochs: 6000
  save_model_interval: 3000
  lr: 1.5e-4 #2e-4
  # sampling
  sample_conditioning: 1.0
  sample_steps: 30
  sample_latents_path: ""
  sample_interval: 500

  # logging/saving
  log_interval: 100
  base_save_path: "/mnt/storage/nacc_sub/dit"
  save_label: "fix_broken_tabv8bisv2_semplificato"
  resume_training: true
  resume_checkpoint_dir: "/mnt/storage/nacc_sub/dit/..."

distributed:
  use_ddp: true
  backend: nccl

tabsyn:
  vae_lr: 1e-3
  tabsyn_pretrain_steps: 12000
  use_checkpoint: true
  checkpoint_path: "/home/PRISMS/data/computations/tabsyn_checkpoint.ckp"
  early_stop:
    patience: 6
    min_delta: 1e-3
    eval_every: 200
    max_val_batches: 32